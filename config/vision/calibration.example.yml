%YAML:1.0
---
# 仿射标定采点模板，填写同一平面上实测的像素和基座毫米坐标
calibration_id: "replace-with-real-calibration-id"
camera:
  id: "sc3336-1280x720-fixed-focus-v1"
  width: 1280
  height: 720
# 当前使用原图像素，K与distortion留空；误差由独立采点验收
plane_z_mm: .Nan
allowed_error_mm: .Nan
# 每组格式：{ pixel: [u, v], base_xy: [X_mm, Y_mm] }
# 至少3个不共线拟合点；上机建议采四角，并另采中心和边缘作为检查点
# 采点高度与标定平面一致，检查点单独测量
fit_points: []
check_points: []
