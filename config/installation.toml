# 已归档机位。现场示教用 15-site 保存到 config/site/installation.toml。

# 两轴都在同一示教姿态记录 drive_deg（驱动读数）和 joint_deg（机械角）。
# ratio 是驱动每转 1° 时关节转过的度数，符号表示方向。
[j2] # 大臂，机械角相对基座
link_mm = 275
drive_deg = -53.23
joint_deg = -46.55739022952628
ratio = 0.8
# range_deg = [最小机械角, 最大机械角]  # 本机实测待补，大臂相对基座，单位度

[j3] # 小臂，机械角相对大臂
link_mm = 275
drive_deg = -76.971
joint_deg = -86.7326337110621
ratio = -0.3333333333333333
# range_deg = [最小机械角, 最大机械角]  # 本机实测待补，小臂相对大臂，单位度

[z] # J1 丝杆驱动角。只填贴子角时，本机按经验抬升约 4.3 cm。
touch_deg = -20225.7605

[motion]
observe_deg = [0.404, -23.939] # 观察位的 J2、J3 驱动角
discard_mm = [165.15406706485533, -245.16524414593607] # 弃子点的基座 X、Y
speed_deg_s = [4800, 42, 106] # 以下两行依次为 J1、J2、J3
accel_deg_s2 = [5700, 110, 180]

[camera]
url = "rtsp://192.168.31.123/live/0" # 电脑台架取流使用
crop_px = [375, 8] # 640×640 取景框的左上角

[board]
# 从红方看，每个角点依次为原图 u、v（像素）和吸头 X、Y（基座毫米）。
red_left   = [447.09289980014006, 55.57567622139173, -173.8023129975593, -387.5925717144836]
red_right  = [408.1932172990374, 553.9950271059687, 65.78688259030096, -424.91897760487274]
black_left = [982.6774964405543, 96.55278255369922, -134.82560508806856, -133.70063738059653]
