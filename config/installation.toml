# 已归档实测机位。新机位用 config/site/installation.toml。
[arm]
lengths_mm = [275, 275]
# 同一示教姿态下 J2 反馈角、J3 电机角，与对应的肩、肘机械角。
reference_drive_deg = [-53.23, -76.971]
reference_joint_rad = [-0.812579750641072, -1.513770027184262]
# 驱动转一度，关节转多少度。负值代表反向。
joint_per_drive = [0.8, -0.3333333333333333]

[z]
# J1 到取子点和搬运层的示教角。释放默认同取子，净空默认同搬运。
pickup_deg = -20225.7605
travel_deg = -18219.66

[motion]
park_deg = [0.404, -23.939] # J2、J3 驱动角
discard_xy_mm = [165.15406706485533, -245.16524414593607]
# J1、J2、J3 限幅，按驱动角计。
velocity_deg_s = [4800, 42, 106]
acceleration_deg_s2 = [5700, 110, 180]

[vision]
camera_url = "rtsp://192.168.31.123/live/0"
roi = [370, 28, 650, 600]
# 红左、红右、黑左。每行是 [原图 u, 原图 v, 基座 X 毫米, 基座 Y 毫米]。
points = [
    [447.09289980014006, 55.57567622139173, -173.8023129975593, -387.5925717144836],
    [408.1932172990374, 553.9950271059687, 65.78688259030096, -424.91897760487274],
    [982.6774964405543, 96.55278255369922, -134.82560508806856, -133.70063738059653],
]
target_offsets_mm = [[9, 0, 1.036, 3.044]] # 行、列、X 修正、Y 修正

[game]
# 缺省由红方先走，玩家执红。可填 red_to_move、human_red、think_ms。
