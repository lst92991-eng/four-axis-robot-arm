<!doctype html>
<meta charset="utf-8" />
<title>象棋对弈状态</title>
<style>
    body {
        font: 18px sans-serif;
        background: #18212b;
        color: #edf2f7;
        margin: 20px;
    }
    img {
        width: 100%;
        height: auto;
        background: #111;
    }
    table {
        border-collapse: collapse;
        margin: 20px 0;
    }
    td {
        width: 36px;
        height: 36px;
        text-align: center;
        border: 1px solid #73808b;
    }
    .red {
        color: #ff7979;
    }
    pre {
        white-space: pre-wrap;
    }
    #mode {
        color: #ffd779;
    }
</style>
<h1>象棋对弈状态</h1>
<p id="mode"></p>
<p id="phase">等待主程序状态</p>
<p>最近一次识别画面：左侧YOLO，右侧保存的固定交点。思考和运动时相机暂停。</p>
<img id="preview" alt="等待识别画面" />
<table id="board"></table>
<pre id="details"></pre>
<p>本页只读。终端回车确认；停止用Ctrl+C。恢复指令按终端提示操作。</p>
<script>
    const names = {
        k: "将",
        a: "士",
        b: "象",
        n: "马",
        r: "车",
        c: "炮",
        p: "卒",
        K: "帅",
        A: "仕",
        B: "相",
        N: "马",
        R: "车",
        C: "炮",
        P: "兵",
        ".": "",
        "?": "?",
    };
    const phases = {
        prepare: "准备机械臂",
        observing: "正在识别",
        confirm_start: "请在终端确认初始盘面",
        thinking: "引擎思考",
        wait_human: "等待你走棋",
        executing: "机械臂执行中",
        recovery: "等待人工处理",
        stopped: "已停止",
        finished: "对局结束",
        review_required: "已停止，等待人工裁定重复局面",
        error: "程序遇到错误",
        board_changed: "盘面发生变化",
        start_unreadable: "初始盘面还未读清",
    };
    async function update() {
        try {
            const state = await (await fetch("status.json?t=" + Date.now(), { cache: "no-store" })).json();
            document.querySelector("#mode").textContent = state.simulated
                ? "仿真模式：没有真实相机、引擎或电机动作。"
                : "实机接口模式：执行结果由外部执行器回传。";
            document.querySelector("#phase").textContent = phases[state.phase] || state.phase;
            const table = document.querySelector("#board");
            table.replaceChildren();
            for (const row of state.observation_valid ? state.observed : state.board) {
                const tr = document.createElement("tr");
                for (const piece of row) {
                    const td = document.createElement("td");
                    td.textContent = names[piece] ?? "?";
                    if (/[A-Z]/.test(piece)) td.className = "red";
                    tr.append(td);
                }
                table.append(tr);
            }
            document.querySelector("#details").textContent =
                "状态记录时间：" +
                new Date(state.updated_at_ms).toLocaleString() +
                "（非心跳）\n识别帧：" +
                state.frame_id +
                "\n" +
                "结果：" +
                ["进行中", "红方胜", "黑方胜", "和棋", "待人工裁定"][state.result] +
                "\n已完成走法：" +
                state.history +
                "\n待确认动作：" +
                Boolean(state.pending) +
                "\n" +
                state.error;
            const image = document.querySelector("#preview");
            image.hidden = Boolean(state.simulated);
            if (!state.simulated) image.src = "preview.jpg?t=" + Date.now();
        } catch (error) {
            document.querySelector("#phase").textContent = "尚未读到status.json，请检查主程序。";
        }
    }
    update();
    setInterval(update, 1000);
</script>
